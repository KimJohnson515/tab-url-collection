<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>탭 정리기</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>탭 정리기</h1>
      <span id="summary" class="summary"></span>
      <button id="refresh" type="button" class="ghost" title="목록 새로고침">새로고침</button>
    </div>
    <div class="options">
      <label>범위
        <select id="scope">
          <option value="all">모든 창</option>
          <option value="current">현재 창</option>
        </select>
      </label>
      <label><input type="checkbox" id="groupDomain"> 도메인별 묶기</label>
      <label><input type="checkbox" id="includeInternal"> 내부 페이지 포함</label>
    </div>
  </header>

  <main id="list" aria-live="polite"></main>

  <footer>
    <div class="selection">
      <span id="selCount"></span>
      <span class="spacer"></span>
      <button id="selAll" type="button" class="ghost">전체 선택</button>
      <button id="selNone" type="button" class="ghost">선택 해제</button>
      <button id="resetStats" type="button" class="ghost" title="쌓인 열람 횟수·체류 시간 기록을 모두 지우고 처음부터 다시 기록합니다.">기록 초기화</button>
    </div>

    <div class="action-row">
      <span class="label">문서</span>
      <button id="mdSave" type="button">Markdown 저장</button>
      <button id="htmlSave" type="button">HTML 저장</button>
      <button id="mdCopy" type="button">복사</button>
    </div>

    <div class="action-row">
      <span class="label">시트</span>
      <button id="csvSave" type="button">CSV 저장</button>
      <button id="sheets" type="button" title="표를 복사한 뒤 새 구글 시트를 엽니다. A1 셀에 붙여넣기(Ctrl+V) 하세요.">구글 시트로 복사</button>
    </div>

    <div class="action-row">
      <span class="label">즐겨찾기</span>
      <button id="bookmarks" type="button" title="기타 즐겨찾기에 '탭 정리 날짜' 폴더를 만들고, 우선순위 순서대로 1. 이름, 2. 이름 … 으로 저장합니다.">즐겨찾기 폴더로 저장 (우선순위 번호순)</button>
    </div>

    <div class="action-row">
      <span class="label">전송</span>
      <label class="check"><input type="checkbox" id="toGithub"> GitHub</label>
      <label class="check"><input type="checkbox" id="toNotion"> 노션</label>
      <button id="send" type="button" title="체크한 탭을 위에서 고른 곳(GitHub·노션)으로 한 번에 보냅니다.">선택한 탭 보내기</button>
    </div>
    <details id="sendSettings" class="gh">
      <summary>전송 설정 (GitHub·노션)</summary>
      <div class="settings-body">
        <div class="sub">GitHub</div>
        <div class="gh-grid">
          <label>저장소 <input id="ghRepo" type="text" placeholder="계정/저장소 (비공개 저장소 권장)" autocomplete="off" spellcheck="false"></label>
          <label>토큰 <input id="ghToken" type="password" placeholder="Fine-grained 토큰 (Contents: 읽기 및 쓰기)" autocomplete="off"></label>
          <label>폴더 <input id="ghFolder" type="text" placeholder="tabs" autocomplete="off" spellcheck="false"></label>
          <label>브랜치 <input id="ghBranch" type="text" placeholder="비워 두면 저장소 기본 브랜치" autocomplete="off" spellcheck="false"></label>
        </div>
        <p class="hint">토큰은 이 브라우저에만 저장되고 api.github.com 으로만 전송됩니다. 한 저장소에만 권한을 준 토큰을 쓰세요.</p>
        <div class="sub">노션</div>
        <div class="gh-grid">
          <label>토큰 <input id="ntToken" type="password" placeholder="통합 토큰 (ntn_… 또는 secret_…)" autocomplete="off"></label>
          <label>페이지 <input id="ntPage" type="text" placeholder="탭 목록을 쌓을 노션 페이지 주소" autocomplete="off" spellcheck="false"></label>
        </div>
        <p class="hint">그 페이지의 연결(Connections)에 통합을 추가해야 합니다. 토큰은 이 브라우저에만 저장되고 api.notion.com 으로만 전송됩니다.</p>
      </div>
    </details>

    <div class="action-row">
      <span class="label">메일</span>
      <input id="email" type="text" placeholder="받는 사람 (선택, 쉼표로 구분)" autocomplete="off" spellcheck="false">
      <button id="gmail" type="button">Gmail</button>
      <button id="mailto" type="button">메일 앱</button>
    </div>

    <div id="toast" class="toast" role="status"></div>
  </footer>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
